name: fctp | Amazon VPC Dev Environment

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Terraform Action
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:

  terraform:

    name: Deploy Amazon VPC

    runs-on: ubuntu-latest

    environment:
      name: Development

    defaults:
      run:
        shell: bash
        working-directory: environments/network/vpc/dev

    steps:

      ############################################################
      # Checkout Repository
      ############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # Configure AWS Credentials
      ############################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      ############################################################
      # Setup Terraform
      ############################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      ############################################################
      # Terraform Init
      ############################################################

      - name: Terraform Init
        run: terraform init

      ############################################################
      # Terraform Validate
      ############################################################

      - name: Terraform Validate
        run: terraform validate

      ############################################################
      # Terraform Plan
      ############################################################

      - name: Terraform Plan

        if: github.event.inputs.terraform_action == 'apply'

        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan

      ############################################################
      # Terraform Apply
      ############################################################

      - name: Terraform Apply

        if: github.event.inputs.terraform_action == 'apply'

        run: |
          terraform apply \
            -auto-approve \
            tfplan

      ############################################################
      # Terraform Destroy
      ############################################################

      - name: Terraform Destroy

        if: github.event.inputs.terraform_action == 'destroy'

        run: |
          terraform destroy \
            -var-file="terraform.tfvars" \
            -auto-approve